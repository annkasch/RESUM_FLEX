# Raw folders describe event statistics; lf/hf below assign modeling roles.
# To include zero-hit files, add the corresponding by_primaries/N<count>/zero folder.
# Explicit split rules also reproduce the LF1500/HF10 split from scratch.
source:
  directories:
    lf:
    - /global/cfs/cdirs/m2676/users/aschuetz/data/lar_optical_map/by_primaries/N1500/nonzero
    hf:
    - /global/cfs/cdirs/m2676/users/aschuetz/data/lar_optical_map/by_primaries/N5000/nonzero
  exclude_files: []
output_directory: outputs/optical_map_v1
theta:
  coordinates: cartesian
  center_source: filename
  cylindrical:
    include_azimuth: true
    angle_encoding: sin_cos
phi:
  vertex:
    representation: offset
    coordinates: cartesian
  momentum:
    representation: components
target:
  kind: any_channel
  detector_id: null
split:
  lf_train_only: true
  hf_train_count: 10
  train_fraction: 0.7
  validation_fraction: 0.15
  test_fraction: 0.15
  seed: 42
  manifest: outputs/optical_map_v1/splits/voxel_split.json
normalization:
  method: standard
  fit_on: training
