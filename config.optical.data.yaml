# Raw simulation inputs; folder lists contain .stp.lh5 files directly.
# Explicit split rules also reproduce the LF1500/HF10 split from scratch.
source:
  directories:
    lf:
    - /global/cfs/cdirs/m2676/users/aschuetz/data/lar_optical_map/lf1500_hf_nonzero/lf
    hf:
    - /global/cfs/cdirs/m2676/users/aschuetz/data/lar_optical_map/lf1500_hf_nonzero/hf
  exclude_files: []
output_directory: outputs/optical_data_alllf_hf10_nonzero
theta:
  coordinates: cartesian
  center_source: filename
  cylindrical:
    include_azimuth: true
    angle_encoding: sin_cos
phi:
  vertex:
    representation: offset
    coordinates: cartesian
  momentum:
    representation: components
target:
  kind: any_channel
  detector_id: null
split:
  lf_train_only: true
  hf_train_count: 10
  train_fraction: 0.7
  validation_fraction: 0.15
  test_fraction: 0.15
  seed: 42
  manifest: outputs/optical_data_alllf_hf10_nonzero/splits/voxel_split.json
normalization:
  method: standard
  fit_on: training
