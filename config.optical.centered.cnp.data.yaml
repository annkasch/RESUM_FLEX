# Ian Wang's centered_425_375_375 box (x 0.365-0.485, y 0.315-0.435, z 0.2975-0.4525 m, 5 mm
# voxels), LF only (1500 primaries/voxel), for CNP-only work (2026-10-22).
# LF_sim -> training; Ian's separate validation/lf voxels -> 50/50 validation/test.
# Voxels partly overlapping a Ge detector (smaller LAr fill volume) are kept as normal voxels.
source:
  sources:
  - path: /global/cfs/projectdirs/m2676/users/iwang/sim_output/centered_425_375_375/LF_sim/lf
    fractions: {cnp_train: 1.0}
  - path: /global/cfs/projectdirs/m2676/users/iwang/sim_output/centered_425_375_375/validation/lf/lf
    fractions: {cnp_validation: 0.5, cnp_test: 0.5}
  # Inputs only (vertex + momentum, no optical hits): context-free model predictions for the
  # GP's level 0. Disjoint from LF_sim/validation; contains the 200 HF_sim voxels.
  - path: /global/cfs/projectdirs/m2676/users/iwang/sim_output/centered_425_375_375/LF_primaries/lf
    fractions: {gp_unlabeled: 1.0}
  # Crashed runs: N=1 with the single vertex at the origin.
  exclude_files:
  - lf/run00782_v00010738_x+0.4300_y+0.3650_z+0.3875.stp.lh5
  - lf/run00150_v00009939_x+0.4250_y+0.3650_z+0.3925.stp.lh5
  # LF_primaries: crashed (N=1 at the origin) and truncated (54 of 1500 events) runs.
  - lf/run00888_v00010803_x+0.4300_y+0.3750_z+0.3925.stp.lh5
  - lf/run00921_v00009171_x+0.4200_y+0.3700_z+0.3925.stp.lh5
  - lf/run01461_v00010772_x+0.4300_y+0.3700_z+0.3975.stp.lh5
output_directory: outputs/optical_centered_cnp_v0
theta:
  coordinates: cartesian
  center_source: filename
phi:
  vertex:
    representation: offset
    coordinates: cartesian
  momentum:
    representation: components
target:
  kind: any_channel
  detector_id: null
split:
  seed: 42
  manifest: outputs/optical_centered_cnp_v0/splits/voxel_split.json
normalization:
  method: standard
  fit_on: training
