# Lower-cylinder v0: copy of config.optical.resum.yaml pointed at outputs/optical_lower_cyl_v0.
model:
  kind: cnp
  encoder:
    type: mlp
    latent_dim: 64
    hidden_dims: [128, 128]
    dropout: 0.0
training:
  backend: neural
  loss: bernoulli
  n_steps: 12000
  eval_every: 250
  learning_rate: 0.001
  batch_size: 16
  n_events: 128
  n_context_min: 16
  n_context_max: 64
  seed: 0
  device: cpu
  focal_gamma: 0
  objective:
    strategy: single
  sampling:
    strategy: class_aware_mixup
    mixup:
      alpha: 0.2
      mix_context: true
  weighting:
    strategy: none
selection: voxel_rate_mae
lf_validation: false
data_directory: outputs/optical_lower_cyl_v0
output_directory: outputs/optical_resum/lower_cyl_v0/seed0
validation_context_events: 64
validation_seed: 12345
mfgp:
  # Lowest to highest fidelity; the last level is the target.
  levels:
  - {source: model_mean, partition: train, fidelity: lf}
  - {source: model_mean, partition: train, fidelity: hf}
  - {source: observed_fraction, partition: train, fidelity: hf}
  evaluation:
  - {partition: validation, fidelity: hf}
  projections:
    plots: [projected_axes, projected_planes]
    enabled: true
    domain: training_convex_hull
    grid_steps: 12
    n_draws: 8192
    seed: 42
    axis_labels: [x, y, z]
    units: m
  output_transform: log
  raw_pseudocount: 0.5
  cnp_log_floor: 1.0e-12
  kernel: rbf
  n_restarts: 5
  n_context: 64
  seed: 0
